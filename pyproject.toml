[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renson-healthbox-go"
version = "0.1.0"
description = "Async client for the local Renson Healthbox Go API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Roy Henkemans"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation"
]
dependencies = ["aiohttp>=3.9.0"]

[project.urls]
Homepage = "https://github.com/royhenkemans/renson-healthbox-go"
Issues = "https://github.com/royhenkemans/renson-healthbox-go/issues"
Source = "https://github.com/royhenkemans/renson-healthbox-go"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[tool.hatch.build.targets.sdist]
include = ["src/renson_healthbox_go"]

[tool.hatch.build.targets.wheel]
packages = ["src/renson_healthbox_go"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=renson_healthbox_go --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100

